# Local environment: Postgres + the API using it.
#   docker compose up -d db          -> only the database (run the API from Visual Studio / dotnet run)
#   docker compose up --build        -> database + API on http://localhost:8080
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: planingpoker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/planingpoker
      ASPNETCORE_ENVIRONMENT: Development
      Enviroments__ClientPolicyUrl: http://localhost:8080
    ports:
      - "8080:8080"

volumes:
  pgdata:
