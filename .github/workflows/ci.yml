name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build and test)
    # System.Data.SQLite ships its native interop for Windows only.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PlaningPoker.sln

      - name: Build
        run: dotnet build PlaningPoker.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test PlaningPoker.sln --no-build --configuration Release

  frontend:
    name: Frontend (lint and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PlaningPoker.App
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: PlaningPoker.App/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint -- --no-fix

      - name: Build
        run: npm run build
